[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "videodownloader"
version = "3.0.0"
description = "Explainable 4-Stage Multi-Engine Media Resolution Framework & Fluent Desktop Video Downloader (PyQt6 Fluent UI + Global Quick Capture + Optional Web/Mobile & MCP Server)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PyQt6>=6.6.0,<7.0.0",
    "PyQt6-Fluent-Widgets>=1.5.4,<2.0.0",
    "pynput>=1.7.7,<2.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "websockets>=12.0,<17.0",
    "python-multipart>=0.0.9,<1.0.0",
    "requests>=2.31.0,<3.0.0",
    "yt-dlp>=2026.10.26,<2028.0.0",
    "yt-dlp-ejs>=0.8.0,<2.0.0",
    "curl_cffi>=0.7.0,<1.0.0",
    "imageio-ffmpeg>=0.5.1,<1.0.0",
    "qrcode>=7.4.2,<9.0.0",
    "pillow>=10.0.0,<13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
    "httpx>=0.27.0,<1.0.0",
    "pyinstaller>=6.22.0,<7.0.0",
    "altgraph>=0.17.5,<1.0.0",
]

[project.scripts]
videodownloader = "videodownloader.launcher:main"
videodownloader-mcp = "videodownloader.ai.mcp_server:main"

[tool.setuptools.packages.find]
include = ["videodownloader*"]

[tool.setuptools.package-data]
videodownloader = ["assets/**/*", "web_static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
